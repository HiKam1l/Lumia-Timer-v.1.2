<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1ba1e2"><title>Таймер Lumia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff;font-family:"Segoe UI",Arial,sans-serif;height:100%}
body{overflow:auto}.app{width:100%;max-width:480px;margin:auto;padding:14px}
.title{font-size:30px;font-weight:300;margin:4px 0 15px}.tabs{display:flex;border-bottom:2px solid #333}
.tab{width:50%;padding:12px 2px;text-align:center;color:#aaa;font-size:16px;border-bottom:3px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.panel{display:none;text-align:center}.panel.active{display:block}
.time{font-size:60px;font-weight:300;margin:38px 0 28px;white-space:nowrap}button{font-family:"Segoe UI",Arial,sans-serif;border:0;color:#fff;background:var(--accent);font-size:18px;padding:12px 16px;margin:4px;min-width:100px}
button.secondary{background:#333}button:active{opacity:.65}.inputs{display:flex;justify-content:center;align-items:center;margin:35px 0 8px}
input{width:88px;background:#191919;color:#fff;border:1px solid #555;font-size:30px;text-align:center;padding:7px}.inputs span{font-size:30px;margin:0 5px}
.hint{color:#888;font-size:14px;margin-top:15px}#laps{margin:24px 0;border-top:1px solid #333;text-align:left;max-height:190px;overflow:hidden}
.lap{padding:9px 3px;border-bottom:1px solid #333;color:#bbb}.lap b{float:right;color:#fff}
.settings{margin-top:30px;border-top:1px solid #333;padding-top:17px}.settings-title{font-size:16px;color:#aaa;margin-bottom:10px}
.colors{display:flex;justify-content:center;flex-wrap:wrap}.color{min-width:0;width:34px;height:34px;padding:0;border-radius:0;margin:4px;border:2px solid #555}.color.selected{border-color:#fff}
.finished{animation:blink .7s infinite}@keyframes blink{50%{opacity:.35}}.small{font-size:12px;color:#666;margin-top:20px}
</style></head><body><div class="app">
<div class="title">Таймер</div><div class="tabs">
<div class="tab active" id="tabSW" onclick="showPanel('sw')">Секундомер</div>
<div class="tab" id="tabTM" onclick="showPanel('tm')">Таймер</div></div>
<div id="sw" class="panel active"><div class="time" id="swTime">00:00.00</div>
<button id="swStart" onclick="swToggle()">Старт</button><button class="secondary" onclick="swLap()">Круг</button><button class="secondary" onclick="swReset()">Сброс</button><div id="laps"></div></div>
<div id="tm" class="panel"><div class="inputs"><input id="min" type="number" min="0" max="99" value="1"><span>:</span><input id="sec" type="number" min="0" max="59" value="00"></div>
<div class="time" id="tmTime">01:00</div><button id="tmStart" onclick="tmToggle()">Старт</button><button class="secondary" onclick="tmReset()">Сброс</button><div class="hint">Минуты : секунды</div></div>
<div class="settings"><div class="settings-title">Цвет системы</div><div class="colors" id="colors"></div><div class="small">Выбранный цвет сохраняется.</div></div></div>
<script>
(function(){
var KEY='lumia_timer_v3',state={swRun:false,swStart:0,swElapsed:0,tmRun:false,tmEnd:0,tmLeft:60,accent:'#1ba1e2'},swInt=null,tmInt=null,lapCount=0;
var colors=['#1ba1e2','#aa00ff','#e51400','#f7630c','#ffb900','#8cbf26','#60a917','#00a300','#00aba9','#00b7c3','#e3008c','#e74856'];
function by(id){return document.getElementById(id)}function pad(n){return n<10?'0'+n:n}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){for(var k in x)state[k]=x[k]}}catch(e){}}
function applyAccent(){document.documentElement.style.setProperty('--accent',state.accent);var b=by('colors').getElementsByTagName('button'),i;for(i=0;i<b.length;i++)b[i].className='color'+(b[i].getAttribute('data-c')===state.accent?' selected':'')}
function makeColors(){var box=by('colors'),i,b;for(i=0;i<colors.length;i++){b=document.createElement('button');b.className='color';b.style.backgroundColor=colors[i];b.setAttribute('data-c',colors[i]);b.onclick=(function(c){return function(){state.accent=c;applyAccent();save()}})(colors[i]);box.appendChild(b)}}
function showPanel(p){by('sw').className='panel'+(p==='sw'?' active':'');by('tm').className='panel'+(p==='tm'?' active':'');by('tabSW').className='tab'+(p==='sw'?' active':'');by('tabTM').className='tab'+(p==='tm'?' active':'')}
function swValue(){return state.swElapsed+(state.swRun?(new Date().getTime()-state.swStart):0)}
function fmtSW(ms){var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return pad(m)+':'+pad(s)+'.'+pad(cs)}
function swDraw(){by('swTime').innerHTML=fmtSW(swValue())}
function swToggle(){if(state.swRun){state.swElapsed=swValue();state.swRun=false;window.clearInterval(swInt);by('swStart').innerHTML='Старт'}else{state.swStart=new Date().getTime();state.swRun=true;swInt=window.setInterval(swDraw,40);by('swStart').innerHTML='Пауза'}save()}
function swLap(){if(!state.swRun)return;lapCount++;var d=document.createElement('div');d.className='lap';d.innerHTML='Круг '+lapCount+' <b>'+fmtSW(swValue())+'</b>';by('laps').insertBefore(d,by('laps').firstChild)}
function swReset(){state.swRun=false;state.swStart=0;state.swElapsed=0;lapCount=0;window.clearInterval(swInt);by('swTime').innerHTML='00:00.00';by('swStart').innerHTML='Старт';by('laps').innerHTML='';save()}
function inputSeconds(){var m=parseInt(by('min').value,10)||0,s=parseInt(by('sec').value,10)||0;if(m<0)m=0;if(m>99)m=99;if(s<0)s=0;if(s>59)s=59;by('min').value=m;by('sec').value=pad(s);return m*60+s}
function tmDraw(){if(state.tmRun)state.tmLeft=Math.max(0,Math.ceil((state.tmEnd-new Date().getTime())/1000));by('tmTime').innerHTML=pad(Math.floor(state.tmLeft/60))+':'+pad(state.tmLeft%60)}
function beep(){try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}}
function tmFinished(){state.tmRun=false;state.tmLeft=0;window.clearInterval(tmInt);by('tmStart').innerHTML='Старт';by('tmTime').className='time finished';beep();save();window.setTimeout(function(){by('tmTime').className='time'},3000)}
function tmToggle(){if(state.tmRun){state.tmLeft=Math.max(0,Math.ceil((state.tmEnd-new Date().getTime())/1000));state.tmRun=false;window.clearInterval(tmInt);by('tmStart').innerHTML='Старт';save();return}if(state.tmLeft<=0)state.tmLeft=inputSeconds();if(state.tmLeft<=0)return;state.tmEnd=new Date().getTime()+state.tmLeft*1000;state.tmRun=true;by('tmStart').innerHTML='Пауза';tmInt=window.setInterval(function(){tmDraw();if(state.tmLeft<=0)tmFinished();else save()},250);save()}
function tmReset(){state.tmRun=false;window.clearInterval(tmInt);state.tmLeft=inputSeconds();state.tmEnd=0;by('tmStart').innerHTML='Старт';by('tmTime').className='time';tmDraw();save()}
by('min').onchange=tmReset;by('sec').onchange=tmReset;load();makeColors();applyAccent();swDraw();tmDraw();
if(state.swRun)swInt=window.setInterval(swDraw,40);if(state.tmRun){state.tmLeft=Math.max(0,Math.ceil((state.tmEnd-new Date().getTime())/1000));if(state.tmLeft<=0)tmFinished();else{by('tmStart').innerHTML='Пауза';tmInt=window.setInterval(function(){tmDraw();if(state.tmLeft<=0)tmFinished();else save()},250)}}if(state.swRun)by('swStart').innerHTML='Пауза';window.onbeforeunload=save;
})();
</script></body></html>
