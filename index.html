<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Часы</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000000; color: #ffffff;
    font-family: "Segoe UI Semilight", "Segoe UI", Arial, sans-serif;
    overflow: hidden; height: 100%; width: 100%;
    -ms-touch-action: manipulation;
  }
  #wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  #header { padding: 14px 16px 0 16px; }
  #header h1 { margin: 0; font-weight: 200; font-size: 28px; text-transform: uppercase; letter-spacing: 1px; }

  #tabs {
    display: -ms-flexbox; display: flex;
    border-bottom: 1px solid #1a1a1a;
    margin-top: 10px;
  }
  .tab {
    -ms-flex: 1; flex: 1;
    text-align: center;
    padding: 12px 4px;
    font-size: 13px;
    text-transform: uppercase;
    color: #777777;
    letter-spacing: 1px;
    border-bottom: 3px solid transparent;
  }
  .tab.active { color: #ffffff; }

  #panels { position: absolute; top: 96px; left: 0; right: 0; bottom: 64px; }
  .panel { display: none; height: 100%; }
  .panel.active { display: block; }

  .center-col {
    height: 100%;
    display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column;
    -ms-flex-align: center; align-items: center;
    padding-top: 10px;
    box-sizing: border-box;
  }

  #ringHolder { position: relative; width: 220px; height: 220px; margin-top: 6px; }
  #ringCanvas { position: absolute; top: 0; left: 0; }
  #timerDigits {
    position: absolute; top: 0; left: 0; width: 220px; height: 220px;
    display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center;
    -ms-flex-pack: center; justify-content: center;
    font-size: 40px; font-weight: 200; letter-spacing: 1px;
  }

  #timerQuick {
    display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap;
    -ms-flex-pack: center; justify-content: center;
    margin-top: 26px; width: 100%;
  }
  .qbtn {
    width: 76px; margin: 4px; padding: 12px 0; text-align: center;
    background: #151515; color: #cccccc; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
  }

  #swDigits { font-size: 46px; font-weight: 200; margin-top: 30px; letter-spacing: 1px; }
  #swDigits .tenths { font-size: 26px; color: #888888; }

  #laps {
    width: 84%; margin-top: 18px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    max-height: 220px;
  }
  .lapRow {
    display: -ms-flexbox; display: flex; -ms-flex-pack: justify; justify-content: space-between;
    padding: 8px 4px; border-bottom: 1px solid #151515; font-size: 15px; color: #cccccc;
  }

  #colorGrid {
    padding: 14px 8px 0 8px;
    display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap;
    -ms-flex-pack: center; justify-content: center;
    overflow-y: auto; height: 100%; box-sizing: border-box;
  }
  .swatch { width: 60px; height: 60px; margin: 5px; position: relative; }
  .swatch .mark {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    color: #000000; font-size: 22px; text-align: center; line-height: 60px; display: none;
  }
  .swatch.selected .mark { display: block; }

  #appbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    background: #0a0a0a; border-top: 1px solid #1a1a1a;
    display: -ms-flexbox; display: flex; -ms-flex-pack: center; justify-content: center;
    -ms-flex-align: center; align-items: center;
  }
  .abtn {
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid #ffffff;
    display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center;
    -ms-flex-pack: center; justify-content: center;
    margin: 0 14px; font-size: 18px; color: #ffffff;
  }
  .abtn.hidden { display: none; }

  #alarmOverlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 50; display: none;
    display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column;
    -ms-flex-align: center; align-items: center; -ms-flex-pack: center; justify-content: center;
  }
  #alarmOverlay h2 { color: #000000; font-weight: 200; font-size: 30px; text-transform: uppercase; letter-spacing: 1px; }
  #alarmOverlay .stopBtn {
    margin-top: 30px; padding: 16px 44px; background: #000000; color: #ffffff;
    font-size: 16px; text-transform: uppercase; letter-spacing: 1px;
  }
</style>
<style id="themeStyle"></style>
</head>
<body>
<div id="wrap">

  <div id="header"><h1>Часы</h1></div>
  <div id="tabs">
    <div class="tab active" data-tab="timer">Таймер</div>
    <div class="tab" data-tab="stopwatch">Секундомер</div>
    <div class="tab" data-tab="color">Цвет</div>
  </div>

  <div id="panels">

    <div class="panel active" id="panel-timer">
      <div class="center-col">
        <div id="ringHolder">
          <canvas id="ringCanvas" width="220" height="220"></canvas>
          <div id="timerDigits">05:00</div>
        </div>
        <div id="timerQuick">
          <div class="qbtn" data-delta="-60">-1 мин</div>
          <div class="qbtn" data-delta="60">+1 мин</div>
          <div class="qbtn" data-delta="-10">-10 сек</div>
          <div class="qbtn" data-delta="10">+10 сек</div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-stopwatch">
      <div class="center-col">
        <div id="swDigits">00:00<span class="tenths">.0</span></div>
        <div id="laps"></div>
      </div>
    </div>

    <div class="panel" id="panel-color">
      <div id="colorGrid"></div>
    </div>

  </div>

  <div id="appbar">
    <div class="abtn" id="btnStart">&#9658;</div>
    <div class="abtn" id="btnReset">&#8635;</div>
    <div class="abtn hidden" id="btnLap">&#9873;</div>
  </div>

  <div id="alarmOverlay">
    <h2>Время вышло</h2>
    <div class="stopBtn" id="btnStopAlarm">Стоп</div>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ---------- Универсальное надёжное нажатие ----------
  // Ловим click, pointerup/MSPointerUp и touchend одновременно,
  // но гасим повторный запуск в течение 400мс, чтобы старый и новый
  // движки не срабатывали дважды на одно касание.
  function bindTap(el, handler) {
    var lastFired = 0;
    function fire(e) {
      var now = Date.now();
      if (now - lastFired < 400) return;
      lastFired = now;
      handler(e);
    }
    el.addEventListener("click", fire, false);
    if (window.PointerEvent) el.addEventListener("pointerup", fire, false);
    else if (window.MSPointerEvent) el.addEventListener("MSPointerUp", fire, false);
    el.addEventListener("touchend", fire, false);
  }

  // ---------- Общие элементы ----------
  var tabs = document.getElementsByClassName("tab");
  var panels = document.getElementsByClassName("panel");
  var btnStart = document.getElementById("btnStart");
  var btnReset = document.getElementById("btnReset");
  var btnLap = document.getElementById("btnLap");
  var alarmOverlay = document.getElementById("alarmOverlay");
  var btnStopAlarm = document.getElementById("btnStopAlarm");
  var alarmSound = document.getElementById("alarmSound");
  var themeStyleEl = document.getElementById("themeStyle");

  var currentTab = "timer";
  var currentAccent = "#1BA1E2";

  function selectTab(name) {
    currentTab = name;
    var i;
    for (i = 0; i < tabs.length; i++) {
      if (tabs[i].getAttribute("data-tab") === name) tabs[i].className = "tab active";
      else tabs[i].className = "tab";
    }
    for (i = 0; i < panels.length; i++) {
      if (panels[i].id === "panel-" + name) panels[i].className = "panel active";
      else panels[i].className = "panel";
    }
    updateAppbar();
  }

  var i;
  for (i = 0; i < tabs.length; i++) {
    (function (t) {
      bindTap(t, function () { selectTab(t.getAttribute("data-tab")); });
    })(tabs[i]);
  }

  function updateAppbar() {
    if (currentTab === "timer") {
      btnStart.className = "abtn";
      btnStart.innerHTML = timerRunning ? "&#10074;&#10074;" : "&#9658;";
      btnReset.className = "abtn";
      btnLap.className = "abtn hidden";
    } else if (currentTab === "stopwatch") {
      btnStart.className = "abtn";
      btnStart.innerHTML = swRunning ? "&#10074;&#10074;" : "&#9658;";
      btnReset.className = "abtn";
      btnLap.className = swRunning ? "abtn" : "abtn hidden";
    } else {
      btnStart.className = "abtn hidden";
      btnReset.className = "abtn hidden";
      btnLap.className = "abtn hidden";
    }
  }

  // ---------- Звук будильника ----------
  var alarmInterval = null;
  function startAlarmSound() {
    try { alarmSound.currentTime = 0; alarmSound.play(); } catch (e) {}
    if (alarmInterval) clearInterval(alarmInterval);
    alarmInterval = setInterval(function () {
      try { alarmSound.currentTime = 0; alarmSound.play(); } catch (e) {}
    }, 700);
  }
  function stopAlarmSound() {
    if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
    try { alarmSound.pause(); alarmSound.currentTime = 0; } catch (e) {}
  }

  bindTap(btnStopAlarm, function () {
    stopAlarmSound();
    alarmOverlay.style.display = "none";
  });

  // ---------- Таймер ----------
  var timerTotal = 300;
  var timerRemaining = 300;
  var timerRunning = false;
  var timerTarget = 0;
  var timerLoop = null;
  var ringCanvas = document.getElementById("ringCanvas");
  var ringCtx = ringCanvas.getContext("2d");
  var timerDigitsEl = document.getElementById("timerDigits");

  function fmt(sec) {
    if (sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    var mm = (m < 10 ? "0" : "") + m;
    var ss = (s < 10 ? "0" : "") + s;
    return mm + ":" + ss;
  }

  function drawRing(fraction) {
    var w = ringCanvas.width, h = ringCanvas.height;
    var cx = w / 2, cy = h / 2, r = w / 2 - 10;
    ringCtx.clearRect(0, 0, w, h);
    ringCtx.lineWidth = 8;
    ringCtx.strokeStyle = "#1a1a1a";
    ringCtx.beginPath();
    ringCtx.arc(cx, cy, r, 0, Math.PI * 2);
    ringCtx.stroke();

    ringCtx.strokeStyle = currentAccent;
    ringCtx.beginPath();
    var start = -Math.PI / 2;
    var end = start + Math.PI * 2 * fraction;
    ringCtx.arc(cx, cy, r, start, end);
    ringCtx.stroke();
  }

  function renderTimer() {
    timerDigitsEl.innerHTML = fmt(timerRemaining);
    var fraction = timerTotal > 0 ? (timerRemaining / timerTotal) : 0;
    drawRing(fraction);
  }

  function adjustTimer(delta) {
    if (timerRunning) return;
    timerTotal += delta;
    if (timerTotal < 5) timerTotal = 5;
    if (timerTotal > 5940) timerTotal = 5940;
    timerRemaining = timerTotal;
    renderTimer();
  }

  var qbtns = document.getElementsByClassName("qbtn");
  for (i = 0; i < qbtns.length; i++) {
    (function (b) {
      bindTap(b, function () { adjustTimer(parseInt(b.getAttribute("data-delta"), 10)); });
    })(qbtns[i]);
  }

  function timerTick() {
    var now = Date.now();
    var remainMs = timerTarget - now;
    timerRemaining = Math.max(0, remainMs / 1000);
    renderTimer();
    if (remainMs <= 0) {
      timerRunning = false;
      if (timerLoop) clearInterval(timerLoop);
      timerLoop = null;
      updateAppbar();
      alarmOverlay.style.display = "flex";
      startAlarmSound();
    }
  }

  function startTimer() {
    if (timerRemaining <= 0) timerRemaining = timerTotal;
    timerTarget = Date.now() + timerRemaining * 1000;
    timerRunning = true;
    if (timerLoop) clearInterval(timerLoop);
    timerLoop = setInterval(timerTick, 200);
    updateAppbar();
  }
  function pauseTimer() {
    timerRunning = false;
    if (timerLoop) { clearInterval(timerLoop); timerLoop = null; }
    updateAppbar();
  }
  function resetTimer() {
    pauseTimer();
    timerRemaining = timerTotal;
    renderTimer();
  }

  // ---------- Секундомер ----------
  var swElapsed = 0;
  var swRunning = false;
  var swStartTs = 0;
  var swLoop = null;
  var swDigitsEl = document.getElementById("swDigits");
  var lapsEl = document.getElementById("laps");
  var lapCount = 0;

  function fmtSwText(ms) {
    var totalSec = ms / 1000;
    var m = Math.floor(totalSec / 60);
    var s = Math.floor(totalSec % 60);
    var t = Math.floor((ms % 1000) / 100);
    var mm = (m < 10 ? "0" : "") + m;
    var ss = (s < 10 ? "0" : "") + s;
    return { mm: mm, ss: ss, t: t };
  }

  function renderSw() {
    var now = swRunning ? Date.now() - swStartTs + swElapsed : swElapsed;
    var p = fmtSwText(now);
    swDigitsEl.innerHTML = p.mm + ":" + p.ss + "<span class=\"tenths\">." + p.t + "</span>";
  }

  function startSw() {
    swRunning = true;
    swStartTs = Date.now();
    if (swLoop) clearInterval(swLoop);
    swLoop = setInterval(renderSw, 100);
    updateAppbar();
  }
  function pauseSw() {
    if (swRunning) swElapsed += Date.now() - swStartTs;
    swRunning = false;
    if (swLoop) { clearInterval(swLoop); swLoop = null; }
    renderSw();
    updateAppbar();
  }
  function resetSw() {
    swRunning = false;
    if (swLoop) { clearInterval(swLoop); swLoop = null; }
    swElapsed = 0;
    lapCount = 0;
    lapsEl.innerHTML = "";
    renderSw();
    updateAppbar();
  }
  function lapSw() {
    lapCount++;
    var now = swRunning ? Date.now() - swStartTs + swElapsed : swElapsed;
    var p = fmtSwText(now);
    var row = document.createElement("div");
    row.className = "lapRow";
    row.innerHTML = "<span>Круг " + lapCount + "</span><span>" + p.mm + ":" + p.ss + "." + p.t + "</span>";
    lapsEl.insertBefore(row, lapsEl.firstChild);
  }

  // ---------- Кнопки app bar ----------
  bindTap(btnStart, function () {
    if (currentTab === "timer") {
      if (timerRunning) pauseTimer(); else startTimer();
    } else if (currentTab === "stopwatch") {
      if (swRunning) pauseSw(); else startSw();
    }
  });

  bindTap(btnReset, function () {
    if (currentTab === "timer") resetTimer();
    else if (currentTab === "stopwatch") resetSw();
  });

  bindTap(btnLap, function () {
    if (currentTab === "stopwatch" && swRunning) lapSw();
  });

  // ---------- Цвет интерфейса ----------
  var ACCENTS = [
    { name: "Лайм", hex: "#A4C400" },
    { name: "Зелёный", hex: "#60A917" },
    { name: "Изумруд", hex: "#008A00" },
    { name: "Бирюза", hex: "#00ABA9" },
    { name: "Циан", hex: "#1BA1E2" },
    { name: "Кобальт", hex: "#0050EF" },
    { name: "Индиго", hex: "#6A00FF" },
    { name: "Фиолетовый", hex: "#AA00FF" },
    { name: "Розовый", hex: "#F472D0" },
    { name: "Маджента", hex: "#D80073" },
    { name: "Малиновый", hex: "#A20025" },
    { name: "Красный", hex: "#E51400" },
    { name: "Оранжевый", hex: "#FA6800" },
    { name: "Янтарь", hex: "#F0A30A" },
    { name: "Жёлтый", hex: "#E3C800" },
    { name: "Коричневый", hex: "#825A2C" },
    { name: "Оливковый", hex: "#6D8764" },
    { name: "Сталь", hex: "#647687" },
    { name: "Мов", hex: "#76608A" },
    { name: "Тауп", hex: "#87794E" }
  ];

  var colorGrid = document.getElementById("colorGrid");
  var swatchEls = [];

  function buildColorGrid() {
    var j, a, el, mark;
    for (j = 0; j < ACCENTS.length; j++) {
      a = ACCENTS[j];
      el = document.createElement("div");
      el.className = "swatch";
      el.style.background = a.hex;
      mark = document.createElement("div");
      mark.className = "mark";
      mark.innerHTML = "&#10003;";
      el.appendChild(mark);
      (function (hex, node) {
        bindTap(node, function () { setAccent(hex); });
      })(a.hex, el);
      colorGrid.appendChild(el);
      swatchEls.push({ el: el, hex: a.hex });
    }
  }

  function setStyleContent(el, css) {
    if (el.styleSheet) { el.styleSheet.cssText = css; } else { el.textContent = css; }
  }

  function setAccent(hex) {
    currentAccent = hex;
    var css =
      ".tab.active{border-bottom:3px solid " + hex + ";}" +
      ".qbtn:active{background:" + hex + ";color:#000000;}" +
      "#btnStart{border-color:" + hex + ";color:" + hex + ";}" +
      ".lapRow span:first-child{color:" + hex + ";}" +
      "#alarmOverlay{background:" + hex + ";}";
    setStyleContent(themeStyleEl, css);

    try { if (window.localStorage) window.localStorage.setItem("wpAccent", hex); } catch (e) {}

    var j;
    for (j = 0; j < swatchEls.length; j++) {
      if (swatchEls[j].hex.toLowerCase() === hex.toLowerCase()) swatchEls[j].el.className = "swatch selected";
      else swatchEls[j].el.className = "swatch";
    }
    renderTimer();
  }

  function loadAccent() {
    var hex = "#1BA1E2";
    try { if (window.localStorage) { var v = window.localStorage.getItem("wpAccent"); if (v) hex = v; } } catch (e) {}
    setAccent(hex);
  }

  buildColorGrid();
  loadAccent();

  // ---------- Инициализация ----------
  renderTimer();
  renderSw();
  updateAppbar();
})();
</script>
</body>
</html>
